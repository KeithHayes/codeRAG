doomsteadRAG:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  text_embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 800
  chunk_overlap: 150
  vector_db_type: "faiss"
  text_parsing:
    strategy: "semantic"
    preserve_comments: true
    detect_paragraphs: true
    min_chunk_size: 200
    separators:
      - "\n\n"
      - "\n"
      - ". "
      - "! "
      - "? "
      - " "
  code_dirs:
    txt:
      - "assets/docs"
  pdf: []
  vector_db_path: "assets/data/ragdocs/faiss_index"
  collection_name: "ragdocs"
  min_score: "0.25"
  ollama_model: "deepseek-coder:6.7b"
  system_prompt: "You are a helpful documentation assistant. Answer based on the provided context. Focus on documentation content, specifications, and textual information."
  user_prompt_template: "Context:\n{context}\n\nQuestion: {question}\n\nAnswer based on the documentation context above."
  toolbar:
    - "fileload"
    - "homeserver"
    - "fullbuild"
    - "loadmodel"
    - "choosemodel"
    - "book"
    - "target"