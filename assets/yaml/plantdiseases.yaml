toolbar:
  - 'fileload'
  - 'homeserver'
  - 'fullbuild'
  - 'loadmodel'
  - 'choosemodel'
  - 'book'
  - 'target'
  
controls:
  - 'userinput'
  - 'sendbutton'

ollama_model: "falcon3:7b-instruct-q8_0"

system_prompt: "You are an expert agricultural assistant specializing in plant diseases. Answer based on the provided context. Be specific, cite symptoms, causes, and treatments when possible. Use the code context if relevant."

user_prompt_template: "Context:\n{context}\n\nQuestion:\n{question}\n\nAnswer:"

doomsteadRAG:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  text_embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 800
  chunk_overlap: 150
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - "! "
    - "? "
    - " "
  code_dirs: {}
  pdf:
    - "assets/data/plantdiseases"
  specification_files: []