toolbar:
  - 'fileload'
  - 'homeserver'
  - 'pastetranscript'
  - 'runtask'
  - 'choosemodel'
  - 'book'
  - 'target'

ollama_model: "sunapi386/llama-3-lexi-uncensored:8b"

stages:
  - name: "remove_definition_blocks"
    type: regex
    enabled: true
    pattern: '\[\d+\]\s+The\s+"[^"]+"\s+refers\s+to\s+[^\n]+\n?'
    replacement: ''
    flags: 'g'
    description: "Remove repetitive definition blocks (not present in this transcript but kept for safety)"

  - name: "clean_timestamps"
    type: regex
    enabled: true
    pattern: '^\s*(?:\d+:\d+(?::\d+)?|\d+\s+seconds?|\d+\s+minutes?\s*(?:,?\s*\d+\s+seconds?)?)\s*$'
    replacement: ''
    flags: 'gm'
    description: "Remove lines that contain only timestamps (0:13, 13 seconds, 1 minute, 1 second)"

  - name: "extract_speaker_lines"
    type: llm
    enabled: true
    model: "ollama/sunapi386/llama-3-lexi-uncensored:8b"
    system_prompt: |
      You are a transcript processor. Extract only the dialogue lines with speaker labels.
      Remove any non-dialogue text such as descriptions, editorial comments, timestamps, or false starts (like "Start over").
      Normalize speaker names:
        - "Demetri", "Dimitri", "Dimmitri", "Dmitri" → "Demetri"
        - "Laith", "Leith", "Le", "Leth" → "Laith"
      Output only the cleaned dialogue with each line starting with "Speaker: " followed by the spoken text.
      Preserve the order of turns. Do not add any extra commentary.
    user_prompt_template: "Clean the following transcript and output only the dialogue lines with normalized speaker names:\n\n{input}"
    temperature: 0.2
    max_tokens: 16384
    fallback_regex: '^(Demetri|Laith|Dimitri|Dimmitri|Leith|Le|Leth|Host|Guest):.*$'
    fallback_replacement: '$&\n'
    flags: 'gm'

  - name: "merge_and_format"
    type: llm
    enabled: true
    model: "ollama/sunapi386/llama-3-lexi-uncensored:8b"
    system_prompt: |
      You are a transcript formatter. Merge split sentences that are broken across lines (e.g., a sentence that ends with a line break in the middle).
      Add missing punctuation at the end of sentences where appropriate.
      Ensure each speaker turn is separated by a single blank line.
      Do not change the speaker labels or the content of the speech.
      Output the formatted transcript.
    user_prompt_template: "Format the following dialogue transcript:\n\n{input}\n\nMerge split lines, add punctuation where missing, and add blank lines between speaker turns."
    temperature: 0.1
    max_tokens: 16384

  - name: "add_header"
    type: llm
    enabled: true
    model: "ollama/sunapi386/llama-3-lexi-uncensored:8b"
    system_prompt: |
      You are a transcript processor. Extract the episode title, host name, guest name, and date from the beginning of the transcript.
      Then prepend a header in this exact format:

      Reason to Resist – Episode Transcript

      Host: [host]
      Guest: [guest]
      Date: [date]

      ---

      [full transcript]

      If the date is not found, use "April 27, 2026". If host not found, use "Demetri Lceras". If guest not found, use "Laith Maru".
      Output only the full transcript with the header.
    user_prompt_template: "Add a header to this transcript:\n\n{input}\n\nOutput the entire transcript with the header as described."
    temperature: 0.2
    max_tokens: 5000