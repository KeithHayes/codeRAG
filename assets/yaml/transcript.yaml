
toolbar:
  - 'fileload'
  - 'homeserver'
  - 'pastetranscript'
  - 'runtask'
  - 'choosemodel'
  - 'book'
  - 'target'

ollama_model: "deepseek-r1:7b"

stages:
  - name: 'remove_definition_blocks'
    type: 'regex'
    pattern: '```[\s\S]*?```'
    replacement: ''
    flags: 'g'
    enabled: true

  - name: 'remove_extra_whitespace'
    type: 'regex'
    pattern: '\n\s*\n+'
    replacement: '\n\n'
    flags: 'g'
    enabled: true

  - name: 'format_paragraphs'
    type: 'llm'
    model: 'deepseek-r1:7b'
    system_prompt: "You are a transcript formatting assistant. Format the transcript into clean, readable paragraphs while preserving all factual content. Do not add or remove information. Just organize the text into coherent paragraphs."
    user_prompt_template: "Format the following transcript into clean paragraphs:\n\n{input}"
    temperature: 0.1
    max_tokens: 8192
    enabled: true