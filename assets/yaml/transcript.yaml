# assets/yaml/transcript.yaml
toolbar:
  - 'fileload'
  - 'homeserver'
  - 'pastetranscript'
  - 'runtask'
  - 'choosemodel'
  - 'book'
  - 'target'

ollama_model: "llama3.2:1b"

global:
  default_model: "llama3.2:1b"
  default_temperature: 0.1
  default_max_tokens: 4096

pipeline:
  stages:
    disfluency_removal:
      enabled: true
      model: "llama3.2:1b"
      temperature: 0.1
      max_tokens: 4096
      system_prompt: "You are a transcript editor. Remove disfluencies: filler words (uh, um, ah, you know), stutters/repeats (e.g., 'I I I'), false starts. Fix obvious typos in proper names/places when unambiguous (e.g., 'Dimmitri' -> 'Demetri', 'Kamata' -> 'Kalamata'). Correct punctuation and capitalization. Normalize sentence boundaries. Preserve factual claims and quoted text verbatim. Do not change meaning. Output only the cleaned text without any additional commentary."
      user_prompt_template: "Clean the following transcript:\n\n{input}\n\nCleaned transcript:"

    speaker_labeling:
      enabled: true
      model: "llama3.2:1b"
      temperature: 0.1
      max_tokens: 4096
      system_prompt: "You are a transcript editor. Identify speaker turns in the transcript. For each turn, output a line with the speaker label in format 'Speaker Name:' followed by the speaker's text. Use explicit names when known (e.g., 'Demetri Lceras', 'Laith Maru'). For unidentified voices, use 'Host', 'Guest', or 'Speaker N' consistently. Ensure each speaker turn represents a coherent idea, not just line breaks. Preserve all cleaned text exactly. Do not add or remove content. Output only the labeled transcript with one blank line between speaker turns. Do not include any extra text."
      user_prompt_template: "Add speaker labels to the following cleaned transcript:\n\n{input}\n\nLabeled transcript:"

    semantic_merge_split:
      enabled: true
      model: "llama3.2:1b"
      temperature: 0.1
      max_tokens: 4096
      system_prompt: "You are a transcript editor. Merge very short adjacent turns by the same speaker into a single turn if they are part of the same idea. Split long turns when the speaker clearly changes topic or another speaker replies. Preserve all speaker labels and text exactly, only adjust turn boundaries. Output the final transcript with speaker labels and blank lines between turns. Do not add any commentary."
      user_prompt_template: "Merge or split speaker turns as needed:\n\n{input}\n\nFinal transcript:"