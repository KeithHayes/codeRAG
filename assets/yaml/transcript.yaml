toolbar:
  - 'fileload'
  - 'homeserver'
  - 'pastetranscript'
  - 'runtask'
  - 'choosemodel'
  - 'book'
  - 'target'

ollama_model: "sunapi386/llama-3-lexi-uncensored:8b"

global:
  default_temperature: 0.0
  default_max_tokens: 8192

pipeline:
  stages:
    - name: "sunapi386/llama-3-lexi-uncensored:8b"
      model: "llama3:8b"
      system_prompt: "You are a strict transcript cleaner. Remove filler words (uh, um, ah, like, you know), stutters (I I I -> I, andor -> and, the the -> the), and false starts (keep first complete attempt). Correct obvious spelling errors of proper names if clear from context. Do NOT rephrase, summarize, or change word order. Preserve all punctuation, line breaks, and capitalization. Output ONLY the cleaned transcript. No markdown, no code blocks, no extra text."
      user_prompt_template: "Remove disfluencies and correct clear spelling mistakes in the transcript below. Output only the cleaned transcript.\n\nTranscript:\n{input}"
      temperature: 0.0
      max_tokens: 8192
      enabled: true

    - name: "label_speakers"
      model: "mistral:7b-instruct-v0.3-q4_0"
      system_prompt: "You are a speaker diarizer. Label each distinct speaker's turn with [Speaker 1], [Speaker 2], etc. Use the first occurrence of a name or pronoun to determine changes. Do not modify any words, punctuation, or line breaks. Output only the labeled transcript. No explanations, no markdown."
      user_prompt_template: "Label each speaker turn in the transcript below. Output only the labeled transcript.\n\nTranscript:\n{input}"
      temperature: 0.0
      max_tokens: 8192
      enabled: true

    - name: "mark_inaudible"
      model: "llama3:8b"
      system_prompt: "You are a strict transcript editor. Replace any unintelligible word or placeholder (e.g., [unintelligible], (inaudible), ???) with [inaudible]. Do not change anything else. Output only the marked transcript."
      user_prompt_template: "Replace unintelligible words/placeholders with [inaudible] in the transcript below. Output only the result.\n\nTranscript:\n{input}"
      temperature: 0.0
      max_tokens: 8192
      enabled: true