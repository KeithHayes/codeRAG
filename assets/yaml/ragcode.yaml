toolbar:
  - 'fileload'
  - 'homeserver'
  - 'fullbuild'
  - 'loadmodel'
  - 'choosemodel'
  - 'book'
  - 'target'

ollama_model: "deepseek-coder:6.7b"

system_prompt: "You are a helpful coding assistant. Answer based on the provided code context. Be specific and reference the actual code when possible."

user_prompt_template: "Context:\n{context}\n\nQuestion:\n{question}\n\nAnswer:"

doomsteadRAG:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  text_embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 800
  chunk_overlap: 150
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - "! "
    - "? "
    - " "
  code_dirs:
    php:
      - "assets/php"
    js:
      - "assets/js"
    py:
      - "assets/py"
  pdf: []
  specification_files:
    - "assets/docs/as-built-specification.txt"