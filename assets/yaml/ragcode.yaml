toolbar:
  - 'fileload'
  - 'homeserver'
  - 'fullbuild'
  - 'loadmodel'
  - 'choosemodel'
  - 'book'
  - 'target'

ollama_model: "deepseek-coder:6.7b"

system_prompt: "You are a helpful coding assistant..."

user_prompt_template: "Context:\n{context}\n\nQuestion:\n{question}\n\nAnswer:"

doomsteadRAG:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  chunk_size: 800
  chunk_overlap: 150
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - "! "
    - "? "
    - " "
  code_dirs:
    py:
      - "/path/to/python/code"
    php:
      - "/path/to/php/code"
    js:
      - "/path/to/javascript/code"
  pdf:
    - "/path/to/pdf/documents"
  specification_files:
    - "assets/docs/as-built-specification.txt"
