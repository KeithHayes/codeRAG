doomsteadRAG:
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  chunk_size: 800
  chunk_overlap: 150
  vector_db_type: "faiss"
  code_dirs:
    php:
      - "/var/www/html/doomsteadRAG/assets/php"
    js:
      - "/var/www/html/doomsteadRAG/assets/js"
    css:
      - "/var/www/html/doomsteadRAG/assets/css"
    py:
      - "/var/www/html/doomsteadRAG/assets/py"
  pdf:
    - "/var/www/html/doomsteadRAG/assets/docs"
  vector_db_path: "/var/www/html/doomsteadRAG/assets/data/ragdocs/faiss_index"
  collection_name: "ragdocs"
  min_score: "0.25"
  ollama_model: "deepseek-coder:6.7b"
  system_prompt: "You are a helpful documentation assistant. Answer based on the provided context from documentation files and code. Be specific and reference the actual documentation."
  user_prompt_template: "Context:\n{context}\n\nQuestion: {question}\n\nAnswer based on the documentation and code context above."
  toolbar:
    - "fileloadBTN"
    - "homeserver"
    - "full_build"
    - "loadmodel"
    - "fastapi"
    - "book"
    - "target"